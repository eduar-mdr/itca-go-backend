worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Cache configuration
    proxy_cache_path /var/cache/nginx keys_zone=routes_cache:10m max_size=50m inactive=30s;

    # Upstream backend cluster with least_conn
    upstream itca_backend {
        least_conn;
        server api-1:3000 max_fails=2 fail_timeout=10s;
        server api-2:3000 max_fails=2 fail_timeout=10s;
        server api-3:3000 max_fails=2 fail_timeout=10s;
    }

    # Shared proxy settings
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # HTTP server (port 80) — main entry for Cloudflare Tunnel
    server {
        listen 80;
        server_name _;

        limit_conn conn_limit 20;

        # Health endpoint — no cache, no rate limit
        location /api/health {
            proxy_pass http://itca_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Active routes — cached for 5 seconds
        location /api/routes/active {
            proxy_pass http://itca_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache routes_cache;
            proxy_cache_valid 200 5s;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # All other API endpoints — rate limited, no cache
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://itca_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
    }

    # HTTPS server (port 443) — self-signed TLS for local demo
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        limit_conn conn_limit 20;

        location /api/health {
            proxy_pass http://itca_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location /api/routes/active {
            proxy_pass http://itca_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache routes_cache;
            proxy_cache_valid 200 5s;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://itca_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
    }
}
